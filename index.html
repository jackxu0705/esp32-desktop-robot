<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>桌面机器人 3D 接线核对场景</title>
<style>
  :root{
    --bg:#0f1218; --panel:#171c25; --panel2:#1e242f; --line:#2b3340;
    --txt:#e6ebf2; --dim:#93a0b4; --warn:#ff5a52; --ok:#3ddc84; --review:#ffb020; --opt:#7f8ea3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;overflow:hidden}
  #scene{position:fixed;inset:0}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}

  .lbl{background:rgba(15,18,24,.82);border:1px solid var(--line);border-radius:5px;
    padding:2px 6px;font-size:11px;line-height:1.35;white-space:nowrap;color:var(--txt);
    transform:translateY(-4px)}
  .lbl b{font-weight:600}
  .lbl.part{font-size:12px;font-weight:600;border-left:3px solid var(--ok)}
  .lbl.part.review{border-left-color:var(--review)}
  .lbl.part.unconfirmed{border-left-color:var(--warn)}
  .lbl.part.optional{border-left-color:var(--opt);color:var(--dim)}
  .lbl.pin{font-size:11px;padding:1px 4px;color:#cfe0f5;background:rgba(12,16,22,.82)}
  .lbl.wire{font-size:10px;padding:1px 5px;color:#dbe6f5;border-style:dashed}
  .lbl.wire.unconfirmed{color:#ffd7d4;border-color:var(--warn)}
  .lbl.wire.review{color:#ffe9c2;border-color:var(--review)}
  .lbl.callout{font-size:12.5px;font-weight:600;padding:4px 8px;background:rgba(16,22,32,.96);
    border:1px solid #8ab6ff;border-radius:6px;color:#eaf2ff;white-space:nowrap;
    box-shadow:0 2px 10px #000a}
  .lbl.callout em{font-style:normal;color:#9fc4ff;font-weight:400}

  #hud{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;
    padding:8px 12px;background:linear-gradient(#0f1218e6,#0f121800);flex-wrap:wrap;z-index:20}
  #hud h1{font-size:14px;margin:0 10px 0 0;font-weight:600;letter-spacing:.5px}
  .btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;
    padding:5px 10px;font-size:12px;cursor:pointer;user-select:none}
  .btn:active{transform:translateY(1px)}
  .btn.on{background:#26543f;border-color:#3ddc84;color:#d8ffe9}
  .btn.warn.on{background:#5a2b28;border-color:var(--warn);color:#ffdcd9}

  #legend{position:fixed;left:12px;bottom:12px;background:rgba(23,28,37,.92);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;font-size:11px;z-index:20;max-width:230px}
  #legend h3{margin:0 0 6px;font-size:11px;color:var(--dim);font-weight:600}
  #legend .row{display:flex;align-items:center;gap:6px;margin:3px 0}
  #legend .sw{width:22px;height:0;border-top-width:3px;border-top-style:solid;border-radius:2px;flex:0 0 auto}
  #legend .sw.dash{border-top-style:dashed;border-top-color:var(--warn)}
  #legend .hide{display:none}

  #side{position:fixed;top:0;right:0;bottom:0;width:340px;background:rgba(23,28,37,.96);
    border-left:1px solid var(--line);z-index:25;display:flex;flex-direction:column;transition:transform .22s}
  #side.closed{transform:translateX(100%)}
  #side header{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;
    justify-content:space-between;align-items:center;gap:8px}
  #side header b{font-size:13px}
  #tabs{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tab{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--line);
    background:var(--panel2);color:var(--dim);cursor:pointer}
  .tab.on{color:#fff;border-color:#5b7fb8;background:#243349}
  #detail{padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px;min-height:96px}
  #detail .kv{display:flex;gap:6px;margin:3px 0}
  #detail .kv span:first-child{color:var(--dim);flex:0 0 62px}
  #detail .conn{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
  #detail .conn div{padding:2px 0;cursor:pointer;color:#bcd3ee}
  #detail .conn div:hover{color:#fff}
  #list{flex:1;overflow:auto;padding:6px 10px 16px}
  .item{border:1px solid var(--line);border-radius:7px;padding:6px 8px;margin:6px 0;font-size:11.5px;
    background:#1a2029;cursor:pointer}
  .item:hover{border-color:#4a6b96}
  .item.sel{border-color:#8ab6ff;background:#20304a}
  .item .t{display:flex;align-items:center;gap:6px;font-weight:600;font-size:12px}
  .item .t .dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;border:1px solid #0006}
  .item .m{color:var(--dim);margin-top:3px;line-height:1.5}
  .item .ev{color:#9fb4cd;margin-top:4px;font-size:11px;line-height:1.5}
  .tag{font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid;margin-left:auto}
  .tag.confirmed{color:var(--ok);border-color:#2c6b4a}
  .tag.review{color:var(--review);border-color:#7a5a1d}
  .tag.unconfirmed{color:var(--warn);border-color:#7a3330}
  .tag.optional{color:var(--opt);border-color:#3d4757}
  .sec{font-size:11px;color:var(--dim);margin:12px 2px 2px;letter-spacing:.5px}

  #tip{position:fixed;pointer-events:none;background:#0b0f16e8;border:1px solid var(--line);
    border-radius:6px;padding:4px 8px;font-size:11.5px;z-index:40;display:none;max-width:260px}
  #mask{position:fixed;inset:0;background:#0009;z-index:24;display:none}
  #sideToggle{display:none}

  @media (min-width:821px){ #hud{right:352px} #scene,#labels{right:340px} }
  @media (max-width:820px){
    #side{width:min(88vw,340px);transform:translateX(100%)}
    #side.open{transform:translateX(0)}
    #side.closed{transform:translateX(100%)}
    #sideToggle{display:inline-block}
    #mask.show{display:block}
    #legend{max-width:170px;font-size:10px;padding:6px 8px}
    #hud h1{font-size:12.5px}
    .btn{padding:4px 8px;font-size:11px}
  }
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="scene"></div>
<div id="labels"></div>

<div id="hud">
  <h1>桌面机器人 · 3D 接线核对</h1>
  <button class="btn warn" id="bMode">安全接法</button>
  <button class="btn" id="bTrans">透明</button>
  <button class="btn on" id="bExp">接线视图</button>
  <button class="btn on" id="bLbl">器件标签</button>
  <button class="btn" id="bPin">接口名：关</button>
  <button class="btn on" id="bColor">实物线色</button>
  <button class="btn warn" id="bBad">只看未确认</button>
  <button class="btn" id="bReset">复位视角</button>
  <button class="btn" id="sideToggle">核对表</button>
</div>

<div id="legend">
  <h3>线路类别（线宽按类别区分）</h3>
  <div id="legendRows"></div>
</div>

<div id="mask"></div>
<aside id="side">
  <header><b>接线核对侧栏</b><button class="btn" id="sideClose">收起</button></header>
  <div id="tabs"></div>
  <div id="detail"></div>
  <div id="list"></div>
</aside>
<div id="tip"></div>

const pickables = [];

const wireObjs = [];      // {def, mesh, label, mats}
const std = (c, extra={}) => new THREE.MeshStandardMaterial(
  Object.assign({color:new THREE.Color(c), roughness:.55, metalness:.25}, extra));
const ORIG = Symbol('orig');

function addMesh(group, geo, mat, pos, rot, name){
  const m = new THREE.Mesh(geo, mat);
  if(pos) m.position.set(...pos);
  if(rot) m.rotation.set(...rot);
  m.castShadow = true; m.receiveShadow = true;
  m.userData.baseOpacity = 1;
  group.add(m);
  return m;
}
function pinMesh(part, p, i = 0){
  const g = partGroup(part);
  const px = p.x ?? 0, pz = p.z ?? 0, y = p.y ?? 4.2;
  const gold = std(p.review ? 0xffb020 : 0xd9b45a, {metalness:.85, roughness:.28});

  const pad = new THREE.Mesh(new THREE.BoxGeometry(2.6, .5, 2.6), gold);   // 焊盘：可点、可看
  pad.position.set(px, y, pz);
  pad.castShadow = true;
  pad.userData = {pick:'pin', partId:part.id, pin:p.n, baseOpacity:1};
  g.add(pad); pickables.push(pad);

  const post = new THREE.Mesh(new THREE.CylinderGeometry(.5, .5, 3.2, 10), gold);
  post.position.set(px, y + 1.85, pz);
  post.userData = {pick:'pin', partId:part.id, pin:p.n, baseOpacity:1};
  g.add(post); pickables.push(post);

  // 标签朝焊盘外侧让开，避免压在板子上
  const n = Math.hypot(px, pz);
  const dirx = n > 2 ? px / n : 0, dirz = n > 2 ? pz / n : 0;
  const lbl = makeLabel(p.n, 'lbl pin');
  lbl.position.set(px + dirx * 6, y + 4.4 + (i % 3) * 3.4 + (n > 2 ? 0 : 3), pz + dirz * 6);
  g.add(lbl);

  pinIndex[part.id + '|' + p.n] = {mesh:pad, group:g,
    local:new THREE.Vector3(px, y + 1.2, pz), label:lbl};
}
function partGroup(part){
  if(!partGroups[part.id]){
    const g = new THREE.Group();
    g.position.set(...part.pos);
    if(part.rot) g.rotation.set(THREE.MathUtils.degToRad(part.rot[0]),
                                THREE.MathUtils.degToRad(part.rot[1]),
                                THREE.MathUtils.degToRad(part.rot[2]));
    g.userData = {pick:'part', partId:part.id, home:new THREE.Vector3(...part.pos)};
    scene.add(g);
    partGroups[part.id] = g;
  }
  return partGroups[part.id];
}
function makeLabel(html, cls){
  const d = document.createElement('div');
  d.className = cls;
  d.innerHTML = html;
  return new CSS2DObject(d);
}

      addMesh(g, new THREE.BoxGeometry(6,.8,5), std(0x2a2e35), [0,4.4,2]);
      break;
    }
    case 'buck': {
      addMesh(g, new THREE.BoxGeometry(20,2.2,14), std(0x194f8f, {roughness:.7}), [0,2.6,0]);
      addMesh(g, new THREE.CylinderGeometry(4.4,4.4,4.2,20), std(0x30343b, {metalness:.4}), [-4,5.8,0], [0,0,Math.PI/2]);
      addMesh(g, new THREE.BoxGeometry(5,4,5), std(0x22262d), [4,4.6,2]);
      addMesh(g, new THREE.CylinderGeometry(2.2,2.2,5,14), std(0x1b2a45), [5,4.8,-3.5]);
      break;
    }
    case 'pulldown': {
      addMesh(g, new THREE.BoxGeometry(17,3,6), std(0x2a211b, {roughness:.65}), [0,3,0]);
      for(let i = 0; i < 4; i++){
        addMesh(g, new THREE.BoxGeometry(2.2,3.4,2.4), std(0xc9b28c, {roughness:.5}), [-6 + i * 4,3.2,0]);
      }
      break;
    }
    case 'gear': {
      const shape = new THREE.Shape();
      const teeth = 64, r1 = 20.4, r2 = 22.0, step = Math.PI*2/teeth;
      const prof = [[r2,0],[r2,step*.35],[r1,step*.45],[r1,step*.85],[r2,step*.95]];
      prof.forEach(([r,a], i) => i === 0
        ? shape.moveTo(Math.cos(a)*r, Math.sin(a)*r)
        : shape.lineTo(Math.cos(a)*r, Math.sin(a)*r));
      for(let i=1;i<teeth;i++){
        const off = i*step;
        prof.slice(1).forEach(([r,a]) => shape.lineTo(Math.cos(a+off)*r, Math.sin(a+off)*r));
      }
      shape.closePath();
      const hole = new THREE.Path(); hole.absarc(0,0,1.6,0,Math.PI*2,true); shape.holes.push(hole);
      const geo = new THREE.ExtrudeGeometry(shape, {depth:3.2, bevelEnabled:false});
      geo.rotateX(-Math.PI/2);
      addMesh(g, geo, std(0xb9bec6, {metalness:.9, roughness:.35}), [0,4.8,0]);
      break;
    }
    case 'frame': {
      const rod = new THREE.Group();
      const plateX = 23;
      const brass = () => std(0xc8a24a, {metalness:.9, roughness:.3});
      const up = new THREE.Vector3(0, 1, 0);
      const addRod = (p1, p2, mat) => {
        const dir = p2.clone().sub(p1);
        const len = dir.length();
        if(len < .01) return;
        const m = new THREE.Mesh(new THREE.CylinderGeometry(.5, .5, len, 12), mat);
        m.position.copy(p1).add(p2).multiplyScalar(.5);
        m.quaternion.setFromUnitVectors(up, dir.normalize());
        m.castShadow = true;
        m.userData = {pick:'frame', partId:'frame', baseOpacity:1};   // 杆件降级，别挡住内部器件
        rod.add(m);
      };
      const plateVerts = sx => FRAME.pts.map(p => new THREE.Vector3(sx * plateX, p[1], p[0]));
      for(const sx of [-1, 1]){
        const pts = plateVerts(sx);
        for(let i = 0; i < 8; i++) addRod(pts[i], pts[(i + 1) % 8], brass());
        addRod(pts[FRAME.brace[0]], pts[FRAME.brace[1]],
          Object.assign(std(0xff5a52, {metalness:.4, roughness:.5}), {transparent:true, opacity:.9}));
        for(const p of pts){
          const s = new THREE.Mesh(new THREE.SphereGeometry(.6, 12, 10), brass());
          s.position.copy(p); s.userData.baseOpacity = 1; rod.add(s);
        }
      }
      const L = plateVerts(-1), R = plateVerts(1);
      for(let i = 0; i < 8; i++) addRod(L[i], R[i], brass());
      g.add(rod);
      break;
    }
  }
  g.traverse(o => {
    if(o.isMesh && !o.userData.pick){ o.userData = {pick:'part', partId:part.id}; pickables.push(o); }
  });
  part.pins.forEach(p => pinMesh(part, p));

  const labelHtml = part.kind === 'frame'
    ? `<b>${part.name}</b><br>58×45mm · 红=未标注斜撑`
    : `<b>${part.name}</b>`;
  const lbl = makeLabel(labelHtml, 'lbl part ' + part.status);
  lbl.position.set(0, labelHeight(part), 0);
  const holder = new THREE.Group();          // 反向旋转，让标签始终在器件"上方"而不是随姿态飞出
  if(part.rot) holder.rotation.set(
    THREE.MathUtils.degToRad(-part.rot[0]),
    THREE.MathUtils.degToRad(-part.rot[1]),
    THREE.MathUtils.degToRad(-part.rot[2]));
  holder.add(lbl);
  g.add(holder);
  part._label = lbl;
}
function labelHeight(part){
  return {frame:33, esp32:13, oled:19, driver:13, motor:17, switch:12,
          amp:12, speaker:17, charger:12, cell:20, gear:11,
          bms:12, fuse:10, pmos:12, buck:12, pulldown:10}[part.kind] || 14;
}
PARTS.forEach(buildPart);

/* ---------- 导线 ---------- */
function pinWorld(partId, pinName){
  const k = partId + '|' + pinName;
  const rec = pinIndex[k];
  if(!rec){ console.warn('找不到引脚', k); return new THREE.Vector3(); }
  return rec.group.localToWorld(rec.local.clone());
}
function dashTexture(){
  const cv = document.createElement('canvas');
  cv.width = 64; cv.height = 8;
  const x = cv.getContext('2d');
  x.fillStyle = '#ff2d2d'; x.fillRect(0,0,64,8);
  x.globalAlpha = .28; x.fillStyle = '#160a0a'; x.fillRect(32,0,32,8);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.ClampToEdgeWrapping;
  return t;
}
function wireCurve(a, b, spread, liftScale = 1){
  const d = a.distanceTo(b);
  const lift = Math.min(42, 11 + d * .38) * liftScale;
  const mid = a.clone().add(b).multiplyScalar(.5);
  const chord = b.clone().sub(a);
  let perp = new THREE.Vector3().crossVectors(chord, new THREE.Vector3(0, 1, 0));
  if(perp.lengthSq() < 1e-4) perp.set(1, 0, 0);
  perp.normalize().multiplyScalar(spread);
  const mk = (v, k, h) => v.clone().addScaledVector(perp, k).setY(v.y + h);
  return new THREE.CatmullRomCurve3([
    a,
    mk(a.clone().lerp(mid, .30), .45, lift * .5),
    mk(mid, 1, lift),
    mk(b.clone().lerp(mid, .30), .45, lift * .5),
    b
  ]);
}
function spreadOf(id){
  let h = 0;
  for(const ch of id) h = (h * 31 + ch.charCodeAt(0)) & 1023;
  return ((h % 7) - 3) * 2.6;                        // 同束线横向错开，避免完全重叠
}
function buildWire(def){
  const a = pinWorld(def.from[0], def.from[1]);
  const b = pinWorld(def.to[0], def.to[1]);
  const curve = wireCurve(a, b, spreadOf(def.id));
  const cat = CAT[def.cat];
  const unconfirmed = def.st === 'unconfirmed' || def.st === 'review';
  const radius = cat.r * .58;                         // 按真实杜邦线粗细（约 1mm 直径）
  const geo = new THREE.TubeGeometry(curve, 48, radius, 10, false);
  const col = new THREE.Color(unconfirmed ? CAT.unknown.color : def.color);
  const mat = new THREE.MeshStandardMaterial({
    color:col, roughness:.6, metalness:.1,
    emissive:new THREE.Color(col).multiplyScalar(.18)
  });
  if(unconfirmed){
    const t = dashTexture();
    t.repeat.set(Math.max(2, Math.round(curve.getLength() / 14)), 1);
    mat.map = t; mat.color = new THREE.Color(0xffffff);
    mat.emissive = new THREE.Color(0x551111);
  }
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData = {pick:'wire', wireId:def.id, baseOpacity:1};
  scene.add(mesh);
  pickables.push(mesh);

  // 两端加"杜邦端头"，让每一根线都能看清是插在哪个焊盘上
  const capMat = new THREE.MeshStandardMaterial({color:0x2b3038, roughness:.55, metalness:.15});
  const mkCap = (t, k) => {
    const pos = curve.getPoint(t);
    const tan = curve.getTangent(t).normalize();
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.15, 4.4, 12), capMat);
    cap.position.copy(pos).addScaledVector(tan, k * 1.7);
    cap.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tan);
    cap.userData = {pick:'wire', wireId:def.id, baseOpacity:1};
    scene.add(cap); pickables.push(cap);
    return cap;
  };
  const capA = mkCap(0, 1), capB = mkCap(1, -1);

  const lbl = makeLabel(
    `${def.sig}<br><span style="color:${ST[def.st].color}">${ST[def.st].txt}</span>`,
    'lbl wire ' + def.st);
  lbl.position.copy(curve.getPoint(.5));
  scene.add(lbl);

  wireObjs.push({def, mesh, lbl, curve, radius, mat, capA, capB, capMat});
}
scene.updateMatrixWorld(true);   // 引脚世界坐标依赖已更新的矩阵，否则导线端点会飞走
WIRES.forEach(buildWire);

// 选中导线时在两端显示大号"器件·丝印名"标注
const calloutA = makeLabel('', 'lbl callout');
const calloutB = makeLabel('', 'lbl callout');
calloutA.visible = false; calloutB.visible = false;
scene.add(calloutA); scene.add(calloutB);
const partName = id => (PARTS.find(p => p.id === id) || {name:id}).name;
function updateCallouts(){
  const s = state.selected;
  const w = s && s.type === 'wire' ? wireObjs.find(o => o.def.id === s.id) : null;
  if(!w){ calloutA.visible = false; calloutB.visible = false; return; }
  const a = w.curve.getPoint(0), b = w.curve.getPoint(1);
  calloutA.element.innerHTML = `${partName(w.def.from[0])} <em>· ${w.def.from[1]}</em>`;
  calloutB.element.innerHTML = `${partName(w.def.to[0])} <em>· ${w.def.to[1]}</em>`;
  calloutA.position.copy(a).setY(a.y + 6);
  calloutB.position.copy(b).setY(b.y + 6);
  calloutA.visible = true; calloutB.visible = true;

function focusOn(points, dist){
  const c = new THREE.Vector3();
  points.forEach(p => c.add(p));
  c.divideScalar(points.length);
  const dir = camera.position.clone().sub(controls.target).normalize();
  controls.target.copy(c);
  camera.position.copy(c).addScaledVector(dir, dist || 140);
  controls.update();
}

/* ---------- 自适应取景：按实际投影范围放进画面 ---------- */
function fitBox(box, dir, fill = .82){
  const center = box.getCenter(new THREE.Vector3());
  const right = new THREE.Vector3().crossVectors(camera.up, dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  const tanY = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const tanX = tanY * camera.aspect;
  let dist = controls.minDistance;
  for(const x of [box.min.x, box.max.x])
    for(const y of [box.min.y, box.max.y])
      for(const z of [box.min.z, box.max.z]){
        const d = new THREE.Vector3(x, y, z).sub(center);
        const depth = d.dot(dir);
        dist = Math.max(dist,
          depth + Math.abs(d.dot(up)) / (tanY * fill),
          depth + Math.abs(d.dot(right)) / (tanX * fill));
      }
  dist += 8;
  controls.target.copy(center);
  camera.position.copy(center).addScaledVector(dir, dist);
  scene.fog.near = dist * 1.2;
  scene.fog.far = dist * 3.4;
  controls.maxDistance = Math.max(2600, dist * 2.2);
  controls.update();
}
function fitView(){
  const box = new THREE.Box3();
  Object.values(partGroups).forEach(g => box.expandByObject(g));
  const dir = state.layout === 'bench' ? [-.08, .88, .84] : [-.9, .72, -1.15];
  fitBox(box, new THREE.Vector3(...dir).normalize());
}

/* ============================ 交互 ============================ */
const state = {transparent:false, layout:'bench', labels:true, pinLabels:0, physical:true,
  onlyBad:false, filter:'all', selected:null};
const WIRED_PINS = new Set();
WIRES.forEach(w => { WIRED_PINS.add(w.from.join('|')); WIRED_PINS.add(w.to.join('|')); });

const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const tip = document.getElementById('tip');

function relatedOf(sel){
  const parts = new Set(), wires = new Set(), pins = new Set();
  if(!sel) return {parts, wires, pins};
  if(sel.type === 'part'){
    parts.add(sel.id);
    WIRES.forEach(w => {
      if(w.from[0] === sel.id || w.to[0] === sel.id){
        wires.add(w.id); parts.add(w.from[0]); parts.add(w.to[0]);
        pins.add(w.from.join('|')); pins.add(w.to.join('|'));
      }
    });
  } else if(sel.type === 'wire'){
    const w = WIRES.find(x => x.id === sel.id);
    wires.add(w.id); parts.add(w.from[0]); parts.add(w.to[0]);
    pins.add(w.from[0] + '|' + w.from[1]); pins.add(w.to[0] + '|' + w.to[1]);
  } else if(sel.type === 'pin'){
    parts.add(sel.partId); pins.add(sel.partId + '|' + sel.name);
    WIRES.forEach(w => {
      if(w.from[0] === sel.partId && w.from[1] === sel.name || w.to[0] === sel.partId && w.to[1] === sel.name){
        wires.add(w.id); parts.add(w.from[0]); parts.add(w.to[0]);
      }
    });
  }
  return {parts, wires, pins};
}

function applyEmphasis(){
  const sel = state.selected;
  const {parts, wires, pins} = relatedOf(sel);
  const focus = !!sel;
  const onlyBad = state.onlyBad;
  const selPartId = sel ? (sel.type === 'part' ? sel.id : (sel.type === 'pin' ? sel.partId : null)) : null;

  PARTS.forEach(p => {
    const g = partGroups[p.id];
    const dim = (focus && !parts.has(p.id)) || (onlyBad && p.status === 'confirmed');
    g.traverse(o => {
      if(!o.isMesh) return;
      const m = o.material;
      if(!m[ORIG]) m[ORIG] = {c:m.color.clone(), e:m.emissive ? m.emissive.clone() : null, op:m.opacity, tr:m.transparent};
      const hot = focus && parts.has(p.id) && sel && sel.type === 'part' && sel.id === p.id;
      m.transparent = state.transparent || dim || m[ORIG].tr;
      m.opacity = dim ? .12 : (state.transparent ? .22 : m[ORIG].op);
      m.depthWrite = !(m.transparent && m.opacity < .9);
      if(m.emissive){
        m.emissive.copy(hot ? new THREE.Color(0x2a4a2a) : m[ORIG].e);
        if(dim) m.emissive.setScalar(0);
      }
    });
    if(p._label) p._label.visible = state.labels && !dim &&
      ((!focus && state.layout === 'bench') || selPartId === p.id);
  });

  Object.entries(pinIndex).forEach(([k, rec]) => {
    const m = rec.mesh.material;
    if(!m[ORIG]) m[ORIG] = {c:m.color.clone(), e:m.emissive.clone(), op:1, tr:false};
    const dim = focus && !parts.has(k.split('|')[0]);
    m.transparent = state.transparent || dim;
    m.opacity = dim ? .15 : (state.transparent ? .3 : 1);
    m.emissive.copy(dim ? new THREE.Color(0) : m[ORIG].e);
    rec.label.visible = state.pinLabels > 0 && (state.layout === 'bench' || focus) &&
      (!focus || pins.has(k)) &&
      (state.pinLabels === 2 || WIRED_PINS.has(k) || k.split('|')[0] === selPartId);
  });

  wireObjs.forEach(w => {
    const m = w.mat;
    if(!m[ORIG]) m[ORIG] = {c:m.color.clone(), e:m.emissive.clone(), op:1, tr:false};
    const dim = (focus && !wires.has(w.def.id)) || (onlyBad && !(w.def.st === 'unconfirmed' || w.def.st === 'review'));
    const cat = CAT[w.def.cat];
    const useCat = !state.physical && !(w.def.st === 'unconfirmed' || w.def.st === 'review');
    const base = new THREE.Color(useCat ? cat.color : (w.def.st === 'unconfirmed' || w.def.st === 'review' ? 0xffffff : w.def.color));
    if(m.map){ m.color.copy(base); m.emissive.copy(new THREE.Color(0x661a16)); }
    else { m.color.copy(base); m.emissive.copy(new THREE.Color(base).multiplyScalar(.2)); }
    m.transparent = state.transparent || dim;
    m.opacity = dim ? .07 : (state.transparent ? .8 : 1);
    m.depthWrite = !dim;
    w.capMat.transparent = true;
    w.capMat.opacity = dim ? .08 : .95;
    w.lbl.visible = state.pinLabels && focus && wires.has(w.def.id);
    const scale = focus && wires.has(w.def.id) ? 1.9 : 1;
    w.mesh.scale.setScalar(1);
    w.mesh.geometry.dispose();
    w.mesh.geometry = tubeFor(w, scale);
  });
}
function tubeFor(w, scale){
  const g = new THREE.TubeGeometry(w.curve, 48, w.radius * scale, 10, false);
  if(w.mat.map){
    w.mat.map.repeat.set(Math.max(2, Math.round(w.curve.getLength() / 14)), 1);
    w.mat.map.needsUpdate = true;
  }
  return g;
}

/* ---------- 两个视图：接线视图（器件摊开）/ 装配视图（整机原样） ---------- */
const BENCH = {
  frame:[-390, 0, 40],
  esp32:[-190, 0, -115], driver:[-30, 0, -115], amp:[140, 0, -115],
  oled:[-270, 0, 45], switch:[-120, 0, 55], charger:[10, 0, 55], speaker:[180, 0, 60],
  motorR:[-245, 0, 190], motorL:[-85, 0, 195], battery1:[85, 0, 180], battery2:[200, 0, 180],
  gear1:[-390, 0, -190], gear2:[-255, 0, -190],
  bms:[85, 0, 90], fuse:[285, 0, 30], pmos:[-20, 0, 105],
  buck:[100, 0, 20], pulldown:[-125, 0, -25]
};
function refreshWires(){
  scene.updateMatrixWorld(true);
  const up = new THREE.Vector3(0, 1, 0);
  wireObjs.forEach(w => {
    const a = pinWorld(w.def.from[0], w.def.from[1]);
    const b = pinWorld(w.def.to[0], w.def.to[1]);
    w.curve = wireCurve(a, b, spreadOf(w.def.id), state.layout === 'bench' ? 1 : .28);
    w.mesh.geometry.dispose();
    w.mesh.geometry = tubeFor(w, 1);
    w.lbl.position.copy(w.curve.getPoint(.5));
    const t0 = w.curve.getTangent(0).normalize(), t1 = w.curve.getTangent(1).normalize();
    w.capA.position.copy(w.curve.getPoint(0)).addScaledVector(t0, 1.7);
    w.capA.quaternion.setFromUnitVectors(up, t0);
    w.capB.position.copy(w.curve.getPoint(1)).addScaledVector(t1, -1.7);
    w.capB.quaternion.setFromUnitVectors(up, t1);
  });
  updateCallouts();
}
function applyLayout(){
  const bench = state.layout === 'bench';
  PARTS.forEach(p => {
    const g = partGroups[p.id];
    const pos = bench ? (BENCH[p.id] || p.pos) : p.pos;
    const rot = bench ? [0, 0, 0] : (p.rot || [0, 0, 0]);
    g.position.set(pos[0], pos[1], pos[2]);
    g.userData.home.copy(g.position);
    g.rotation.set(THREE.MathUtils.degToRad(rot[0]),
                   THREE.MathUtils.degToRad(rot[1]),
                   THREE.MathUtils.degToRad(rot[2]));
  });
  refreshWires();
  fitView();
  applyEmphasis();
}

/* ---------- 拾取 ---------- */
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = {x:e.clientX, y:e.clientY}; });
renderer.domElement.addEventListener('pointerup', e => {
  if(!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  down = null;
  if(moved > 6) return;
  const hit = pick(e.clientX, e.clientY);
  select(hit ? hit.sel : null);
});
renderer.domElement.addEventListener('pointermove', e => {
  const hit = pick(e.clientX, e.clientY, true);
  renderer.domElement.style.cursor = hit ? 'pointer' : 'default';
  if(hit){
    tip.style.display = 'block';
    tip.style.left = Math.min(innerWidth - 270, e.clientX + 12) + 'px';
    tip.style.top = (e.clientY + 14) + 'px';
    tip.innerHTML = hit.title;
  } else tip.style.display = 'none';
});
function pick(cx, cy, hover){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables, false).filter(h => h.object.userData.pick);
  // 优先级：焊盘/线 > 器件 > 框架杆，避免笼架挡住内部器件
  const rank = u => u.pick === 'frame' ? 3 : (u.pick === 'part' ? 2 : 1);
  let best = null;
  for(const h of hits){
    if(!best || rank(h.object.userData) < rank(best.object.userData)) best = h;
    if(rank(best.object.userData) === 1) break;
  }
  if(!best) return null;
  const u = best.object.userData;
  if(state.onlyBad && u.pick === 'part'){
    const p = PARTS.find(x => x.id === u.partId);
    if(p && p.status === 'confirmed' && u.partId !== 'frame') return null;
  }
  if(u.pick === 'part' || u.pick === 'frame')
    return {sel:{type:'part', id:u.partId}, title:PARTS.find(p => p.id === u.partId).name};
  if(u.pick === 'pin')
    return {sel:{type:'pin', partId:u.partId, name:u.pin}, title:`${u.partId} · ${u.pin}`};
  if(u.pick === 'wire'){
    const w = WIRES.find(x => x.id === u.wireId);
    return {sel:{type:'wire', id:w.id},
      title:`${w.sig}<br>${w.from.join('.')} → ${w.to.join('.')}`};
  }
  return null;
}

function select(sel, opt){
  state.selected = sel;
  applyEmphasis();
  updateCallouts();
  if(sel && opt && opt.focus){
    if(sel.type === 'wire'){
      const w = wireObjs.find(o => o.def.id === sel.id);
      if(w){
        const box = new THREE.Box3();
        for(let i = 0; i <= 32; i++) box.expandByPoint(w.curve.getPoint(i / 32));
        box.expandByScalar(8);
        fitBox(box, camera.position.clone().sub(controls.target).normalize(), .58);
      }
    } else if(sel.type === 'part' || sel.type === 'pin'){
      const pid = sel.type === 'part' ? sel.id : sel.partId;
      const g = partGroups[pid];
      if(g) focusOn([g.userData.home.clone()], 150);
    }
  }
  renderDetail();
  renderList();
}

/* ============================ 侧栏 ============================ */
const FILTERS = [['all','全部'],['confirmed','已确认'],['review','需核对'],
                 ['unconfirmed','未确认'],['optional','可选/未接入']];
const tabs = document.getElementById('tabs');
FILTERS.forEach(([k, t]) => {
  const b = document.createElement('div');
  b.className = 'tab' + (k === 'all' ? ' on' : '');
  b.textContent = t;
  b.onclick = () => {
    state.filter = k;
    [...tabs.children].forEach(c => c.classList.remove('on'));
    b.classList.add('on');
    renderList();
  };
  tabs.appendChild(b);
});

function passFilter(st){ return state.filter === 'all' || state.filter === st; }

function renderDetail(){
  const el = document.getElementById('detail');
  const s = state.selected;
  if(!s){
    const intro = MODE === 'safe'
      ? `当前为<b style="color:var(--ok)">安全参考接法</b>：双节并联 1S → 保护 → 3A 保险 → 5V 模块 → P-MOS。电机走独立 3V 降压，控制脚避开 GPIO2/8/9。<br>
         点左侧任意导线可逐条查看两端连接。侧栏的红色项是仍需实物确认的安全前提。`
      : `接线视图默认收起接口名，避免遮挡；点左侧清单里任意一根线 → 相机对准、两端显示"器件 · 引脚"，可逐条上下翻。<br>
         需要总览时可点顶部"接口名"。红色虚线 = 未确认或需核对，<b>不得当作已核实结论</b>。顶部"接线视图 / 装配视图"按钮可切换整机。`;
    el.innerHTML = `<div style="color:var(--dim)">${intro}</div>`;
    return;
  }
  if(s.type === 'wire'){
    const w = WIRES.find(x => x.id === s.id);
    const idx = WIRES.findIndex(x => x.id === s.id);
    const pf = partName(w.from[0]), pt = partName(w.to[0]);
    el.innerHTML = `<div class="kv"><span>信号</span><b>${w.sig}</b></div>
      <div class="kv"><span>起点</span>${pf} · <b style="color:#9fc4ff">${w.from[1]}</b></div>
      <div class="kv"><span>终点</span>${pt} · <b style="color:#9fc4ff">${w.to[1]}</b></div>
      <div class="kv"><span>类别</span>${CAT[w.cat].txt}</div>
      <div class="kv"><span>状态</span><span style="color:${ST[w.st].color}">${ST[w.st].txt}</span></div>
      <div class="kv"><span>实物线色</span><span style="display:inline-block;width:26px;height:10px;
        border-radius:3px;background:${w.color};border:1px solid #0006"></span>${w.color}</div>
      <div class="kv" style="align-items:center"><span>逐条核对</span>
        <span style="color:var(--dim)">${idx + 1} / ${WIRES.length}</span>
        <button class="btn" id="wPrev" style="padding:1px 7px;font-size:11px">‹ 上一条</button>
        <button class="btn" id="wNext" style="padding:1px 7px;font-size:11px">下一条 ›</button></div>
      <div class="ev" style="color:#9fb4cd;margin-top:6px;line-height:1.55">${w.ev}</div>`;
    const go = step => select({type:'wire', id:WIRES[(idx + step + WIRES.length) % WIRES.length].id}, {focus:true});
    el.querySelector('#wPrev').onclick = () => go(-1);
    el.querySelector('#wNext').onclick = () => go(1);
    return;
  }
  if(s.type === 'part' || s.type === 'pin'){
    const pid = s.type === 'part' ? s.id : s.partId;
    const p = PARTS.find(x => x.id === pid);
    const conn = WIRES.filter(w => w.from[0] === pid || w.to[0] === pid);
    el.innerHTML = `<div class="kv"><span>器件</span><b>${p.name}</b></div>
      <div class="kv"><span>状态</span><span style="color:${ST[p.status].color}">${ST[p.status].txt}</span></div>
      ${s.type === 'pin' ? `<div class="kv"><span>引脚</span><b>${s.name}</b></div>` : ''}
      <div class="kv"><span>说明</span><span style="line-height:1.5">${p.note}</span></div>
      <div class="kv"><span>接线</span>${conn.length} 根</div>
      ${p.pins.length ? `<div class="kv"><span>接口</span><span style="line-height:1.65;color:#bcd3ee">
        ${p.pins.map(x => x.n).join(' · ')}</span></div>` : ''}
      <div class="conn">${conn.map(w => {
        const other = w.from[0] === pid ? w.to : w.from;
        const on = w.from[0] === pid ? w.from[1] : w.to[1];
        return `<div data-w="${w.id}">· ${w.sig} <span style="color:var(--dim)">${on} → ${other.join('·')}</span>
          <span style="color:${ST[w.st].color}">［${ST[w.st].txt}］</span></div>`;
      }).join('')}</div>`;
    el.querySelectorAll('[data-w]').forEach(d => {
      d.onclick = () => select({type:'wire', id:d.dataset.w});
    });
  }
}

function renderList(){
  const el = document.getElementById('list');
  const sel = state.selected;
  const wires = WIRES.filter(w => passFilter(w.st));
  const parts = PARTS.filter(p => passFilter(p.status));
  const html = [];
  html.push('<div class="sec">待核对 / 未确认清单（含原图依据）</div>');
  WARNINGS.filter(w => passFilter(w.st)).forEach((w, i) => {
    html.push(`<div class="item" style="cursor:default">
      <div class="t"><span class="dot" style="background:${ST[w.st].color}"></span>${w.t}
        <span class="tag ${w.st}">${ST[w.st].txt}</span></div>
      <div class="ev">${w.d}</div></div>`);
  });
  html.push('<div class="sec">接线逻辑自检（电气合理性，不是照抄图面）</div>');
  const LV = {risk:{c:'var(--warn)', t:'风险'}, ok:{c:'var(--ok)', t:'通过'}, wait:{c:'var(--review)', t:'待定'}};
  LOGIC.forEach(l => {
    html.push(`<div class="item" style="cursor:default">
      <div class="t"><span class="dot" style="background:${LV[l.lv].c}"></span>${l.t}
        <span class="tag" style="color:${LV[l.lv].c};border-color:${LV[l.lv].c}">${LV[l.lv].t}</span></div>
      <div class="ev">${l.d}</div></div>`);
  });
  html.push('<div class="sec">导线核对（点击在场景中定位）</div>');
  wires.forEach(w => {
    const on = sel && sel.type === 'wire' && sel.id === w.id;
    html.push(`<div class="item ${on ? 'sel' : ''}" data-wire="${w.id}">
      <div class="t"><span class="dot" style="background:${w.color}"></span>${w.id} · ${w.sig}
        <span class="tag ${w.st}">${ST[w.st].txt}</span></div>
      <div class="m">${partName(w.from[0])} · <b>${w.from[1]}</b> → ${partName(w.to[0])} · <b>${w.to[1]}</b> ｜ ${CAT[w.cat].txt}</div>
      <div class="ev">${w.ev}</div></div>`);
  });
  html.push('<div class="sec">器件</div>');
  parts.forEach(p => {
    const on = sel && sel.type === 'part' && sel.id === p.id;
    html.push(`<div class="item ${on ? 'sel' : ''}" data-part="${p.id}">
      <div class="t"><span class="dot" style="background:${ST[p.status].color}"></span>${p.name}
        <span class="tag ${p.status}">${ST[p.status].txt}</span></div>
      <div class="m">引脚 ${p.pins.length} 个 ｜ ${WIRES.filter(w => w.from[0] === p.id || w.to[0] === p.id).length} 根线</div>
      <div class="ev">${p.note}</div></div>`);
  });
  el.innerHTML = html.join('');
  el.querySelectorAll('[data-wire]').forEach(d => {
    d.onclick = () => select({type:'wire', id:d.dataset.wire}, {focus:true});
  });
  el.querySelectorAll('[data-part]').forEach(d => {
    d.onclick = () => select({type:'part', id:d.dataset.part}, {focus:true});
  });
}

/* ---------- 图例 ---------- */
document.getElementById('legendRows').innerHTML = Object.entries(CAT).map(([k, c]) =>
  `<div class="row"><span class="sw${c.dash ? ' dash' : ''}" style="border-top-color:${c.color};
    border-top-width:${Math.round(c.r * 3)}px"></span>${c.txt}</div>`).join('') +
  `<div class="row" style="margin-top:8px;color:var(--dim)">线宽=类别；点"实物线色"可切换配色口径</div>`;

/* ---------- 工具栏 ---------- */
const bind = (id, key, after) => {
  const b = document.getElementById(id);
  b.onclick = () => {
    state[key] = !state[key];
    b.classList.toggle('on', state[key]);
    if(after) after(state[key]);
    applyEmphasis();
  };
};
bind('bTrans', 'transparent');
document.getElementById('bExp').onclick = () => {
  state.layout = state.layout === 'bench' ? 'assembly' : 'bench';
  const b = document.getElementById('bExp');
  b.textContent = state.layout === 'bench' ? '接线视图' : '装配视图';
  b.classList.toggle('on', state.layout === 'bench');
  applyLayout();
};
bind('bLbl', 'labels');
document.getElementById('bPin').onclick = () => {
  state.pinLabels = (state.pinLabels + 1) % 3;
  const b = document.getElementById('bPin');
  b.textContent = ['接口名：关', '接口名：有线', '接口名：全部'][state.pinLabels];
  b.classList.toggle('on', state.pinLabels > 0);
  applyEmphasis();
};
bind('bColor', 'physical', v => {
  document.getElementById('bColor').textContent = v ? '实物线色' : '类别配色';
});
bind('bBad', 'onlyBad');
document.getElementById('bReset').onclick = () => fitView();

const modeBtn = document.getElementById('bMode');
if(MODE === 'safe'){
  modeBtn.textContent = '返回原图接法';
  modeBtn.classList.add('on');
  modeBtn.classList.remove('warn');
  document.title = '桌面机器人 · 安全参考接线';
  document.querySelector('#hud h1').textContent = '桌面机器人 · 安全参考接线';
}else{
  modeBtn.textContent = '安全接法';
}
modeBtn.onclick = () => {
  location.search = MODE === 'safe' ? '' : '?mode=safe';
};

const side = document.getElementById('side'), mask = document.getElementById('mask');
document.getElementById('sideToggle').onclick = () => {
  side.classList.toggle('open'); mask.classList.toggle('show', side.classList.contains('open'));
};
document.getElementById('sideClose').onclick = () => {
  side.classList.remove('open'); mask.classList.remove('show');
};
mask.onclick = () => { side.classList.remove('open'); mask.classList.remove('show'); };

let desktopLayout = innerWidth > 820;
if(desktopLayout) side.classList.add('open');
let lastAspect = camera.aspect;
addEventListener('resize', () => {
  const desktop = innerWidth > 820;
  if(desktop !== desktopLayout){
    desktopLayout = desktop;
    side.classList.toggle('open', desktop);
    mask.classList.remove('show');
  }
  const a = sizeViews();
  if(!isFinite(lastAspect) || Math.abs(a - lastAspect) > .08){ lastAspect = a; fitView(); }
});
// 侧栏抽屉/浏览器面板展开时窗口不一定触发 resize，用 ResizeObserver 兜底
if(window.ResizeObserver){
  new ResizeObserver(() => {
    const a = sizeViews();
    if(!isFinite(lastAspect) || Math.abs(a - lastAspect) > .02){ lastAspect = a; fitView(); }
  }).observe(document.getElementById('scene'));
}

applyLayout();
renderDetail();
renderList();

let last = performance.now();
function loop(){
  requestAnimationFrame(loop);
  last = performance.now();
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
loop();
</script>
</body>
</html>
